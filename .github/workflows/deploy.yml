# Coleta Meta (somente leitura) -> build -> validação -> portão de aprovação -> GitHub Pages.
# - Roda apenas na main do repositório scale-ag/dash-medclinic (nunca em PR/fork; secrets não são expostos a PRs).
# - Testes antes de coleta/build/deploy. Coleta real validada antes de publicar.
# - Falha em qualquer etapa => nada é enviado ao Pages e o último site válido permanece no ar.
# - Dados comerciais só são publicados com a variável de repositório PUBLIC_DATA_APPROVED=true.
# - Ações oficiais fixadas por SHA de commit (tag conferida via git ls-remote em 25/11/2026).
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Recoletar todo o histórico desde DATA_START (ignora a base incremental)'
        type: boolean
        default: false
  schedule:
    # Contingência horária (UTC). O agendamento principal é externo, a cada 30 min (ver SETUP-CRON.md).
    - cron: '41 * * * *'

permissions: {}

concurrency:
  group: medclinic-pages-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    if: github.repository == 'scale-ag/dash-medclinic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Testes automatizados (sem rede, sem secrets)
        run: npm test

  collect-build:
    name: Coletar, montar e validar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      META_API_VERSION: ${{ vars.META_API_VERSION || 'v25.0' }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill && 'true' || 'false' }}
      BASE_SNAPSHOT_URL: https://scale-ag.github.io/dash-medclinic/data/snapshot.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verificar secret META_ACCESS_TOKEN
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ -z "${META_ACCESS_TOKEN}" ]; then
            echo "::error title=Implantação real pendente::Secret META_ACCESS_TOKEN não cadastrado. Nenhuma coleta foi feita e nada será publicado (sem dados inventados)."
            exit 1
          fi
          echo "Secret presente (valor nunca é impresso)."
      - name: Baixar último snapshot publicado (base incremental, sem credenciais)
        run: node scripts/fetch-base.mjs --url "${BASE_SNAPSHOT_URL}" --out .work/base.json
      - name: Coletar Meta Marketing API (somente leitura)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/collect.mjs --base .work/base.json --out .work/snapshot.json
      - name: Montar site
        run: node scripts/build.mjs --snapshot .work/snapshot.json --out dist
      - name: Coletar Google Ads das duas contas
        env:
          GOOGLE_ADS_OAUTH: ${{ secrets.GOOGLE_ADS_OAUTH }}
          GOOGLE_LEADS_SHEET_ID: ${{ secrets.GOOGLE_LEADS_SHEET_ID }}
          GOOGLE_ADS_API_VERSION: v23
        run: node scripts/collect-google.mjs "$(node -p "require('./config/dashboard.json').data_start")" "$(TZ=America/Sao_Paulo date +%F)" dist/data/google.json
      - name: Validar snapshot, conciliação e ausência de credenciais
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/validate-dist.mjs --dist dist
      - name: Portão de publicação (PUBLIC_DATA_APPROVED)
        env:
          PUBLIC_DATA_APPROVED: ${{ vars.PUBLIC_DATA_APPROVED }}
        run: node scripts/publish-gate.mjs
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publicar no GitHub Pages
    needs: collect-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
